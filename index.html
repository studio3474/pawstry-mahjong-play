<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Purrista">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2a170b">
  <title>Purrista Mahjong</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1f3d3a; overflow: hidden; overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* top/left/right/bottom keep older Safari (before 14.1) happy where "inset" is unknown */
    #wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; inset: 0; display: flex; justify-content: center; }
    /* phone: fill the screen; desktop: a centred portrait column */
    #unity-canvas { height: 100%; width: 100%; max-width: calc(100vh * 0.62); background: #33615c; display: block; outline: none; touch-action: none; }
    /* dvh follows the real visible height on phones (address bar); browsers without it keep the vh rule */
    @supports (height: 100dvh) { #unity-canvas { max-width: calc(100dvh * 0.62); } }
    /* the same scene as the game's loading screen (closed cafe door, logo, saying, one golden bar): the game takes
       over at 90 % and finishes the same bar, so players see a single loading bar */
    #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: #2a170b; }
    #scene { position: relative; height: 100%; width: 100%; max-width: calc(100vh * 0.62); overflow: hidden;
      background: #3a2010 url("TemplateData/door.jpg") center / cover no-repeat; }
    @supports (height: 100dvh) { #scene { max-width: calc(100dvh * 0.62); } }
    #veil { position: absolute; inset: 0; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26, 13, 5, .42); }
    #logo { position: absolute; left: 50%; top: 18%; width: 80%; max-width: 520px; transform: translate(-50%, -50%); }
    #msg { white-space: pre-line; position: absolute; left: 6%; right: 6%; bottom: 25%; text-align: center; color: #fff2d6; font-size: clamp(16px, 4.4vw, 26px);
      font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.75); min-height: 1.4em; }
    #bar { position: absolute; left: 50%; bottom: 17%; width: 76%; height: 18px; transform: translateX(-50%); border-radius: 12px;
      background: #fbeed6; border: 4px solid #4a2610; box-shadow: 0 4px 10px rgba(0,0,0,.45); }
    #fill { position: relative; width: 0%; height: 100%; border-radius: 10px; transition: width .2s;
      background: linear-gradient(to bottom, #fde8c4 0%, #fde8c4 36%, #a4612a 37%, #6f3b14 100%); }
    #cup { position: absolute; right: -34px; bottom: 8px; width: 56px; height: 56px; background: url("TemplateData/cup.png") center/contain no-repeat; animation: sway 1.4s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-3px); } }
    #pct { position: absolute; left: 50%; bottom: calc(17% - 34px); transform: translateX(-50%); color: #fff2d6; font: 700 15px/1 sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div id="scene">
    <div id="veil"></div>
    <img id="logo" src="TemplateData/logo.png" alt="Purrista Mahjong">
    <div id="msg"></div>
    <div id="bar"><div id="fill"><div id="cup"></div></div></div><div id="pct">%0</div>
  </div></div>
  <script>
    // ---- errors. iOS Safari reports an error from the game code (which the loader runs from a blob: address) only as
    // "Script error." with no file or line, and Unity's loader then shows a system alert for it, even when the game
    // carries on. Such errors are only logged; a real crash (the WebAssembly runtime stopped) gets our own card with a
    // reload button. Add ?debug to the address to see every error with its details on screen.
    const debugMode = /[?&]debug\b/.test(location.search);
    const errorLog = [];
    let dbg = null;
    const showDebug = (line) => {
      if (!debugMode) return;
      if (!dbg) {
        dbg = document.createElement("pre");
        dbg.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;margin:0;padding:8px;z-index:2147483647;"
          + "background:rgba(0,0,0,.85);color:#9f9;font:11px/1.35 monospace;white-space:pre-wrap;-webkit-user-select:text;user-select:text;";
        document.body.appendChild(dbg);
      }
      dbg.textContent += line + "\n";
    };
    window.addEventListener("error", e => {
      const where = e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno + ":" + e.colno : "";
      const stack = e.error && e.error.stack ? "\n" + e.error.stack : "";
      errorLog.push(String(e.message) + where);
      showDebug("[error] " + e.message + where + stack);
    }, true);
    window.addEventListener("unhandledrejection", e => showDebug("[promise] " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
    if (debugMode) {
      const origErr = console.error.bind(console), origWarn = console.warn.bind(console);
      console.error = (...a) => { showDebug("[console.error] " + a.join(" ")); origErr(...a); };
      console.warn = (...a) => { showDebug("[console.warn] " + a.join(" ")); origWarn(...a); };
      showDebug("[debug] " + navigator.userAgent + (navigator.standalone ? "  (home screen)" : ""));
    }
    let crashShown = false;
    const showCrash = () => {
      if (crashShown) return;
      crashShown = true;
      const tr2 = (navigator.language || "").toLowerCase().startsWith("tr");
      const card = document.createElement("div");
      card.style.cssText = "position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;background:rgba(20,12,6,.7);";
      card.innerHTML = '<div style="width:min(86vw,360px);background:#FFF6E8;border-radius:22px;padding:24px 20px;text-align:center;color:#4A2E1A;font:600 17px/1.4 system-ui,-apple-system,sans-serif">'
        + (tr2 ? "Bir şeyler ters gitti. İlerlemen kayıtlı; oyunu yeniden açalım." : "Something went wrong. Your progress is saved; let's reopen the game.")
        + '<br><button style="margin-top:16px;border:0;border-radius:14px;padding:12px 26px;background:#3d9b35;color:#fff;font:700 17px system-ui,sans-serif">'
        + (tr2 ? "Yeniden yükle" : "Reload") + '</button></div>';
      card.querySelector("button").onclick = () => location.reload();
      document.body.appendChild(card);
    };
    // Unity calls this before its own alert; returning true means "handled"
    const onUnityError = (message, filename, lineno) => {
      const text = String(message || "");
      showDebug("[unity] " + text + (filename ? " @ " + filename + ":" + lineno : ""));
      const fatal = /abort\(|RuntimeError|unreachable|Out of memory|memory access out of bounds/i.test(text);
      if (fatal) showCrash();
      else console.warn("[purrista] ignored non-fatal error:", text);
      return true;
    };

    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const fill = document.querySelector("#fill");
    const msg = document.querySelector("#msg");
    // famous sayings with their authors while the game loads (same list as in the game)
    const tr = (navigator.language || "").toLowerCase().startsWith("tr");
    const quotes = tr
      ? [["Bin millik bir yolculuk tek bir adımla başlar.","Lao Tzu"],["Hayatta en hakiki mürşit ilimdir.","Mustafa Kemal Atatürk"],["Gelin tanış olalım, işi kolay kılalım.","Yunus Emre"],["Dün dündür, bugün yeni şeyler söylemek lazım.","Mevlânâ"],["Okunacak en büyük kitap insandır.","Hacı Bektaş Veli"],["Sorgulanmamış bir hayat yaşanmaya değmez.","Sokrates"],["Hayatımız, düşüncelerimizin eseridir.","Marcus Aurelius"],["Şans, hazırlığın fırsatla buluştuğu yerdir.","Seneca"],["Bilgi güçtür.","Francis Bacon"],["Sabır acıdır, ama meyvesi tatlıdır.","Jean-Jacques Rousseau"],["Bugün yapabileceğini yarına bırakma.","Benjamin Franklin"],["Hayat bisiklete binmek gibidir; dengede kalmak için ilerlemelisin.","Albert Einstein"],["Yapabileceğine de yapamayacağına da inansan, haklısın.","Henry Ford"],["Damlaya damlaya göl olur.","Atasözü"],["Bir fincan kahvenin kırk yıl hatırı vardır.","Atasözü"],["Sabreden derviş muradına ermiş.","Atasözü"]]
      : [["A journey of a thousand miles begins with a single step.","Lao Tzu"],["The truest guide in life is knowledge.","Mustafa Kemal Atatürk"],["Come, let us be friends and make things easy.","Yunus Emre"],["Yesterday is yesterday; today calls for new words.","Mevlânâ"],["The greatest book to read is a human being.","Hacı Bektaş Veli"],["The unexamined life is not worth living.","Sokrates"],["Our life is what our thoughts make it.","Marcus Aurelius"],["Luck is what happens when preparation meets opportunity.","Seneca"],["Knowledge is power.","Francis Bacon"],["Patience is bitter, but its fruit is sweet.","Jean-Jacques Rousseau"],["Never leave till tomorrow what you can do today.","Benjamin Franklin"],["Life is like riding a bicycle; to keep your balance you must keep moving.","Albert Einstein"],["Whether you think you can or you think you can't, you're right.","Henry Ford"],["Drop by drop, a lake is made.","Turkish proverb"],["A cup of coffee is remembered for forty years.","Turkish proverb"],["The patient dervish reaches his wish.","Turkish proverb"]];
    let qi = Math.floor(Math.random() * quotes.length);
    const showQuote = () => { if (msg.dataset.error) return; const q = quotes[qi++ % quotes.length]; msg.textContent = q[0] + "\n\u2014 " + q[1]; };
    showQuote();
    const quoteTimer = setInterval(showQuote, 3500);
    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/5e0f5e5d1732ce68f348373d7028ccd9.data.unityweb",
      frameworkUrl: buildUrl + "/04c37b7a9e6c1568f899dc4b043df58e.framework.js.unityweb",
      codeUrl: buildUrl + "/1bacae4d6ad3aed40f22dac2b0ac5a9b.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "STudio3474",
      productName: "Purrista Mahjong",
      productVersion: "0.29.1",
      // phones report 3x; 2x keeps iOS Safari inside its memory limits
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (text, type) => { if (type === "error") { msg.dataset.error = "1"; msg.textContent = text; } },
      errorHandler: onUnityError,
      // saves (PlayerPrefs) reach the browser storage by themselves, the way Unity now recommends
      autoSyncPersistentDataPath: true
    };
    // no pinch, double-tap zoom or long-press menus on the game (iOS Safari, Android Chrome)
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    // the game needs WebGL 2 (Safari 15+, Chrome, Edge, Firefox); explain instead of showing a blank page
    const gl2 = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
    if (!gl2) {
      clearInterval(quoteTimer);
      msg.dataset.error = "1";
      msg.textContent = tr ? "Tarayıcın WebGL 2 desteklemiyor. Chrome, Safari 15+ ya da Edge'in güncel sürümünü dene."
                           : "Your browser does not support WebGL 2. Please try an up-to-date Chrome, Safari 15+ or Edge.";
    }
    const script = document.createElement("script");
    script.src = buildUrl + "/031c1d1221bab1bb1011a16a276b52f8.loader.js";
    script.onload = () => {
      createUnityInstance(canvas, config, p => { fill.style.width = Math.round(p * 90) + "%"; document.querySelector("#pct").textContent = "%" + Math.round(p * 90); })
        .then((instance) => {
          window.purristaUnity = instance;
          // the cloud copy goes up when the tab is hidden or closed (a browser gives no "app paused" otherwise)
          var hidden = function () { try { instance.SendMessage("PurristaCloud", "OnPageHidden", ""); } catch (e) { } };
          document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") hidden(); });
          window.addEventListener("pagehide", hidden);
          clearInterval(quoteTimer); fill.style.width = "100%"; document.querySelector("#pct").textContent = "%100"; setTimeout(() => { loading.style.transition = "opacity .35s"; loading.style.opacity = "0"; setTimeout(() => { loading.style.display = "none"; }, 380); }, 350); })
        .catch(e => { msg.textContent = String(e); });
    };
    script.onerror = () => { msg.textContent = "Could not load the game files."; };
    if (gl2) document.body.appendChild(script);
  </script>
</body>
</html>
